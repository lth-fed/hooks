name: CLA Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to re-check after signing
        required: true
        type: string

jobs:
  cla-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve PR author
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            AUTHOR=$(gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }} --jq '.user.login')
          else
            AUTHOR="${{ github.event.pull_request.user.login }}"
          fi
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

      - name: Check CLA signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR="${{ steps.resolve.outputs.author }}"
          echo "Checking CLA for $AUTHOR"

          SIGNATURES=$(gh api "repos/${{ github.repository }}/contents/.github/cla-signatures.json" \
            --jq '.content' | base64 -d)

          if echo "$SIGNATURES" | jq -e --arg user "$AUTHOR" 'index($user) != null' > /dev/null; then
            echo "CLA signed"
          else
            echo "CLA NOT signed by $AUTHOR — comment /sign-cla on the PR to sign"
            exit 1
          fi
